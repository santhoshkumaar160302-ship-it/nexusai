# Continuous delivery and deployment.
#
#   push to main ──▶ CI (ci.yml) passes ──▶ publish image to GHCR ──▶ deploy to Render ──▶ verify live commit
#   push a tag v* ─────────────────────────▶ publish versioned image ──▶ GitHub Release
#
# Deployment is optional: without the RENDER_DEPLOY_HOOK_URL secret the
# pipeline still publishes images and skips the deploy step with a notice.
# Setup steps are in DEPLOYMENT.md.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never interrupt a deploy halfway

jobs:
  publish:
    name: Publish image to GitHub Container Registry
    # From CI: only deploy commits whose CI run succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Resolve the commit and image name
        id: vars
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          owner="${{ github.repository_owner }}"
          echo "image=ghcr.io/${owner,,}/nexusai" >> "$GITHUB_OUTPUT"   # registry names must be lowercase
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.sha }}
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "\`${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: publish
    if: github.event_name != 'push'  # tag pushes publish a release; main deploys
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Trigger the Render deploy hook with the exact image digest
        id: trigger
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; image published, deploy skipped. See DEPLOYMENT.md."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          encoded=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_REF"], safe=""))')
          # Deploying by digest (not :latest) makes the deploy reproducible and auditable.
          curl -fsS -X POST "${HOOK}&imgURL=${encoded}" -o /dev/null
          echo "Deploy triggered for $IMAGE_REF"
      - name: Verify the new commit is live
        if: steps.trigger.outputs.skipped != 'true' && vars.DEPLOY_URL != ''
        env:
          URL: ${{ vars.DEPLOY_URL }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          # Free instances may be asleep and redeploys take a few minutes: poll for up to 10 minutes.
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 20 "$URL/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' || true)
            if [ "$live" = "$SHA" ]; then
              echo "Live: $URL is serving $SHA"
              echo "### Deployed \`${SHA:0:7}\` to $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting ($i/60): live commit '${live:-unreachable}'"
            sleep 10
          done
          echo "::error::$URL did not report commit $SHA within 10 minutes"
          exit 1

  release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --generate-notes \
            --notes "Container image: \`$IMAGE:${TAG#v}\`"
