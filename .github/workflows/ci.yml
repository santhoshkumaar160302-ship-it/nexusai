# Continuous integration: every push and pull request must pass all of these
# before anything is published or deployed (see cd.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, API and PostgreSQL/Redis integration tests (coverage gate in pyproject.toml)
        env:
          NEXUS_TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
          NEXUS_TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest --cov=nexusai --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  quality:
    name: Quality gates (RAG eval + benchmark)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: RAG retrieval must not regress (offline embeddings)
        run: python scripts/eval_rag.py --min-hit 0.9 --min-mrr 0.9
      - name: Gateway must stay reliable and never serve wrong cached answers
        run: python scripts/benchmark.py --requests 5000 --min-success-rate 0.999 --max-wrong-hits 0
      - name: Same checks for a Gemini-only deployment
        env:
          MOCK_PROVIDERS: gemini
        run: python scripts/benchmark.py --requests 5000 --min-success-rate 0.999 --max-wrong-hits 0

  docker:
    name: Docker image builds and serves traffic
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t nexusai:ci .
      - name: Start the container
        run: docker run -d --name nexusai -p 8000:8000 nexusai:ci
      - name: Wait for /health and check the build commit
        run: |
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/health); then
              echo "$body"
              echo "$body" | python -c "import json,sys; assert json.load(sys.stdin)['commit'] == '${{ github.sha }}'"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; exit 1
      - name: Smoke test the API
        run: |
          curl -fsS -X POST http://localhost:8000/v1/chat -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}]}'
          curl -fsS -o /dev/null http://localhost:8000/admin
      - name: Make sure no secrets were baked into the image
        run: |
          if docker run --rm --entrypoint sh nexusai:ci -c 'ls -a /app' | grep -qx '.env'; then
            echo ".env found in image"; exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs nexusai
